name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate guides.json
        run: python3 -c "import json; d=json.load(open('app/src/main/assets/guides.json', encoding='utf-8')); assert d['categories'], 'no categories'"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CrumbleHelper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrumbleHelper-apk
          path: CrumbleHelper.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CrumbleHelper.apk
