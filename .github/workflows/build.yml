name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "배포할 버전 태그 (예: v1.1.0). 비우면 빌드만 함"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate guides.json
        run: python3 -c "import json; d=json.load(open('app/src/main/assets/guides.json', encoding='utf-8')); assert d['categories'], 'no categories'"

      - name: Set version
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ -n "$RELEASE_INPUT" ]]; then
            TAG="$RELEASE_INPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == "${{ github.event.repository.default_branch }}" ]]; then
            # 기본 브랜치에 version.txt 의 버전이 아직 릴리스되지 않았으면 자동 배포
            V="v$(tr -d '[:space:]' < version.txt)"
            if ! gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then TAG="$V"; fi
          fi
          [[ -z "$TAG" || "$TAG" == v* ]] || TAG="v$TAG"
          if [[ -n "$TAG" ]]; then
            echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
            echo "Releasing $TAG"
          fi

      - name: Use signing key from secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Warn if no signing key
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::KEYSTORE_BASE64 시크릿이 없어 임시 디버그 키로 서명합니다. 이 APK는 이전 버전 위에 업데이트 설치가 안 됩니다."

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CrumbleHelper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrumbleHelper-apk
          path: CrumbleHelper.apk

      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: 크럼블 헬퍼 ${{ env.RELEASE_TAG }}
          files: CrumbleHelper.apk
          generate_release_notes: true
          make_latest: true
