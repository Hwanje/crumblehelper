plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hwanje.crumblehelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hwanje.crumblehelper'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 별도 키가 없으면 디버그 키로 서명해서 바로 설치할 수 있게 함
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
